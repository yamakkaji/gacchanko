name: Desktop builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npm run test:store
      - run: npm run test:ui
      - name: Compare Swift and Rust project stores
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          mkdir -p .build/module-cache
          xcrun swiftc -module-cache-path .build/module-cache Sources/Localization.swift Sources/Project.swift tests/parity-driver/main.swift -o .build/parity-driver
          xcrun swiftc -module-cache-path .build/module-cache Sources/Localization.swift Sources/Project.swift tests/store-driver/main.swift -o .build/store-driver
          cargo build --manifest-path src-tauri/Cargo.toml --no-default-features --examples
          node tests/store-parity.cjs
          node tests/tauri-compat.cjs
      - run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --ci
      - uses: actions/upload-artifact@v4
        with:
          name: gacchanko-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Attach installers to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file docs/tauri-release.md
          fi
          mapfile -d '' files < <(find release-artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -print0)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
