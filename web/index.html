<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>がっちゃんこ gacchanko</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><span class="brand-icon">⌘</span><div>がっちゃんこ<small>gacchanko</small></div><span class="version">0.1</span></div>
  <div class="project-title"><span class="project-dot"></span><span id="project-title">Untitled project</span><span id="save-state">未保存</span></div>
  <div class="toolbar"><button id="open-project">開く <kbd>⌘O</kbd></button><button id="save-project">保存 <kbd>⌘S</kbd></button><button class="primary" id="handoff">↗ エージェントに渡す</button></div>
</header>
<main>
<aside class="left-panel">
  <div class="section-heading">WORKSPACE<button id="new-project" title="新しいグラフ">＋</button></div>
  <button class="workspace-card" id="project-settings"><span class="folder-icon">▧</span><span><strong id="workspace-name">Untitled project</strong><small id="workspace-subtitle">未保存</small></span><span>⌃</span></button>
  <div class="section-heading spaced">COMPONENTS<span id="node-count" class="count">0</span></div>
  <div id="node-list"></div>
  <button id="add-node" class="add-component">＋ コンポーネントを追加</button>
  <div class="left-bottom"><button id="show-help">ヘルプ <span>↗</span></button><button id="reveal-project">プロジェクトを Finder で開く</button></div>
</aside>
<section class="canvas-shell">
  <div class="canvas-top"><div><span class="eyebrow">DESIGN CANVAS</span></div><div class="canvas-badges"><span id="edge-count">0 connections</span><span id="ready-count">0 verified</span></div></div>
  <div id="canvas" tabindex="0" aria-label="ノードキャンバス">
    <div id="world"><svg id="edges"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><g id="edge-paths"></g></svg><div id="nodes"></div></div>
    <div id="empty-state"><div><button class="primary" id="empty-add">＋ フォルダを選ぶ</button><button id="load-example">サンプルを開く</button></div></div>
    <div id="connect-hint" hidden>接続先の入力ポートをクリック · Esc でキャンセル</div>
    <div class="canvas-controls"><button id="zoom-out" title="縮小">−</button><span id="zoom-label">100%</span><button id="zoom-in" title="拡大">＋</button><div></div><button id="fit-view" title="全体を表示">⌗</button><button id="undo" title="元に戻す">↶</button><button id="redo" title="やり直す">↷</button></div>
    <div class="canvas-legend"><i></i> 未実装 <i class="implemented"></i> 実装済 <i class="verified"></i> 検証済</div>
  </div>
  <div id="external-banner" hidden>外部でグラフが更新されました。<button id="reload-project">再読み込み</button><button id="export-draft">未保存分を JSON 書き出し</button></div>
  <footer><span id="status-text"></span></footer>
</section>
<aside class="right-panel" id="inspector"></aside>
</main>
<div id="toast" role="status" hidden></div>
<dialog id="modal"><form method="dialog"><div id="modal-content"></div></form></dialog>
<script src="bridge.js"></script>
<script src="app.js"></script>
</body></html>
